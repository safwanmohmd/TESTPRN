<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ekart NDD Priority ZPL/PRN Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    .container {
      display: grid;
      grid-template-columns: 320px auto;
      gap: 28px;
      align-items: start;
      max-width: 1100px;
      width: 100%;
    }

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .form-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
    }

    .form-box h2 {
      font-size: 14px;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 12px;
    }

    .field-group {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 2px;
    }

    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #ffffff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    input:focus {
      border-color: #58a6ff;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      width: 100%;
      padding: 9px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-zip {
      background-color: #f59e0b;
      color: #ffffff;
    }

    .btn-prn {
      background-color: #1f6feb;
      color: #ffffff;
    }

    .btn-print {
      background-color: #30363d;
      color: #ffffff;
    }

    .preview-stage {
      background: #21262d;
      padding: 24px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    /* PHYSICAL PRINTER SIZE: 669px by 467px (Full Bleed Surface) */
    .thermal-label {
      width: 669px;
      height: 467px;
      min-width: 669px;
      min-height: 467px;
      background: #ffffff;
      color: #000000;
      border-radius: 4px;
      padding: 16px 20px 14px 20px;
      position: relative;
      font-family: Arial, Helvetica, sans-serif;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      user-select: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Line across entire 669px */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 22px;
      border-bottom: 1.5px solid #000000;
      padding-bottom: 2px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-prepaid {
      font-size: 13px;
      font-weight: 800;
    }

    .status-priority {
      background: #000000;
      color: #ffffff;
      padding: 2px 6px;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    /* Middle Layout */
    .middle-layout {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 20px;
      height: 360px;
      align-items: start;
      margin-top: 8px;
    }

    /* Left Barcode & Batch */
    .left-side {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .rotator-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 50px;
      height: 270px;
    }

    .rotator {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg) translate(-270px, 0);
      transform-origin: top left;
      display: flex;
      align-items: center;
      height: 50px;
      width: 270px;
    }

    .rot-text {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 270px;
      padding-left: 6px;
      font-family: Arial, sans-serif;
      font-weight: 800;
      font-size: 11px;
      white-space: nowrap;
    }

    .bottom-batch {
      position: absolute;
      top: 290px;
      left: 6px;
    }

    .batch-code-1 {
      font-size: 13px;
      font-weight: 900;
      font-family: Arial, sans-serif;
    }

    .batch-code-2 {
      font-size: 9.5px;
      font-weight: 700;
      font-family: Arial, sans-serif;
      margin: 1px 0 2px 0;
    }

    /* Right Section: Large QR Code + Address + Footer */
    .right-side {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 20px;
      height: 100%;
      align-items: start;
    }

    .qr-box {
      width: 200px;
      height: 200px;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .address-info {
      font-size: 12.5px;
      line-height: 1.35;
      color: #000000;
    }

    .cust-name {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .pin-line {
      font-weight: 800;
      margin-top: 3px;
    }

    /* Bottom Info */
    .bottom-info-bar {
      grid-column: 1 / span 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 18px;
    }

    .npq-badge {
      font-size: 14px;
      font-weight: 900;
      margin-left: 10px;
    }

    .flipkart-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }

    .fk-text {
      font-size: 11px;
      font-weight: 600;
      color: #334155;
    }

    .fk-order {
      font-size: 13px;
      font-weight: 900;
      font-family: Arial, sans-serif;
    }

    @media print {
      body {
        background: transparent;
        padding: 0;
      }
      .form-box {
        display: none;
      }
      .preview-stage {
        background: transparent;
        padding: 0;
      }
      .thermal-label {
        box-shadow: none;
        border-radius: 0;
        position: absolute;
        top: 0;
        left: 0;
      }
      @page {
        size: 669px 467px;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Configuration Form -->
    <div class="form-box">
      <h2>Ekart Label Config</h2>

      <div class="field-group">
        <label>Tracking ID (TID) *</label>
        <input type="text" id="inTid" value="FMPP4251661422" oninput="render()" />
      </div>

      <div class="field-group">
        <label>Hub Code</label>
        <input type="text" id="inHub" value="CCJ/KOT" oninput="render()" />
      </div>

      <div class="field-group">
        <label>Order Reference ID</label>
        <input type="text" id="inOrder" value="S99090861540" oninput="render()" />
      </div>

      <div class="field-group">
        <label>Customer Name</label>
        <input type="text" id="inName" value="Nasrin K" oninput="render()" />
      </div>

      <div class="field-group">
        <label>Address Line 1</label>
        <input type="text" id="inAddr1" value="Kuruniyan saw mill Othukkungal" oninput="render()" />
      </div>

      <div class="field-group">
        <label>Landmark</label>
        <input type="text" id="inLandmark" value="after the transformer" oninput="render()" />
      </div>

      <div class="field-group">
        <label>Locality</label>
        <input type="text" id="inLocality" value="Nottanalakkal, Othukkungal, Near Jamia Ihyaussun" oninput="render()" />
      </div>

      <div class="field-group">
        <label>District & PIN</label>
        <input type="text" id="inPin" value="Malappuram - 676528" oninput="render()" />
      </div>

      <div class="field-group">
        <label>State</label>
        <input type="text" id="inState" value="Kerala" oninput="render()" />
      </div>

      <div class="actions">
        <button class="btn-zip" onclick="downloadZip()">
          📦 Download shipments_[TID].zip
        </button>
        <button class="btn-prn" onclick="downloadPrn()">
          📄 Download shipmentId_[TID].prn
        </button>
        <button class="btn-print" onclick="window.print()">
          🖨️ Direct Print
        </button>
      </div>
    </div>

    <!-- Live Preview Stage (Exact 669x467 aspect ratio) -->
    <div class="preview-stage">
      <div class="thermal-label">
        <!-- Top Line Header -->
        <div class="top-header">
          <span class="brand-title">NDD E-Kart Logistics</span>
          <div class="status-group">
            <span class="status-prepaid">PREPAID</span>
            <span class="status-priority">PRIORITY</span>
          </div>
        </div>

        <!-- Middle Layout -->
        <div class="middle-layout">
          <!-- Left: Vertical Code 128 Barcode + Batch -->
          <div class="left-side">
            <div class="rotator-box">
              <div class="rotator">
                <svg id="svgMainBarcode"></svg>
                <div class="rot-text">
                  <span id="txtHub">CCJ/KOT</span>
                  <span id="txtTid">FMPP4251661422</span>
                </div>
              </div>
            </div>

            <div class="bottom-batch">
              <div class="batch-code-1">13-09</div>
              <div class="batch-code-2">LIAADSJ270015039</div>
              <svg id="svgMiniBarcode"></svg>
            </div>
          </div>

          <!-- Right: QR Code + Address + Bottom Section -->
          <div class="right-side">
            <div class="qr-box">
              <img id="qrImg" src="" alt="QR" />
            </div>

            <div class="address-info">
              <div class="cust-name" id="txtName">Nasrin 1 K</div>
              <div id="txtAddr1">Kuruniyan saw mill Othukkungal</div>
              <div id="txtLandmark" style="font-style: italic; color: #475569;">after the transformer</div>
              <div id="txtLocality">Nottanalakkal, Othukkungal, Near Jamia Ihyaussun</div>
              <div class="pin-line" id="txtPin">Malappuram - 676528</div>
              <div id="txtState">Kerala</div>
            </div>

            <div class="bottom-info-bar">
              <span class="npq-badge">NPQ</span>
              <div class="flipkart-block">
                <span class="fk-text">Ordered Through Flipkart</span>
                <span class="fk-order" id="txtOrder">S99090861540</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function render() {
      const tid = document.getElementById('inTid').value.trim() || 'FMPP4251661422';
      const hub = document.getElementById('inHub').value.trim() || 'CCJ/KOT';
      const order = document.getElementById('inOrder').value.trim() || 'S99090861540';
      const name = document.getElementById('inName').value;
      const addr1 = document.getElementById('inAddr1').value;
      const landmark = document.getElementById('inLandmark').value;
      const locality = document.getElementById('inLocality').value;
      const pin = document.getElementById('inPin').value;
      const state = document.getElementById('inState').value;

      document.getElementById('txtHub').textContent = hub;
      document.getElementById('txtTid').textContent = tid;
      document.getElementById('txtName').textContent = name;
      document.getElementById('txtAddr1').textContent = addr1;
      document.getElementById('txtLandmark').textContent = landmark;
      document.getElementById('txtLocality').textContent = locality;
      document.getElementById('txtPin').textContent = pin;
      document.getElementById('txtState').textContent = state;
      document.getElementById('txtOrder').textContent = order;

      // Vertical Barcode
      try {
        JsBarcode("#svgMainBarcode", tid, {
          format: "CODE128",
          width: 1.5,
          height: 38,
          displayValue: false,
          margin: 0,
          background: "transparent",
          lineColor: "#000000"
        });
      } catch (e) {}

      // Mini Route Barcode (Bottom Left)
      try {
        JsBarcode("#svgMiniBarcode", "1309", {
          format: "CODE128",
          width: 1.1,
          height: 24,
          displayValue: false,
          margin: 0,
          background: "transparent",
          lineColor: "#000000"
        });
      } catch (e) {}

      // Square 2D QR Code
      const qrData = `${tid};${order};${pin}`;
      document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;
    }

    // Build ZPL scaled to fill the 669 x 467 thermal label area
    function buildZpl() {
      const tid = document.getElementById('inTid').value.trim();
      const hub = document.getElementById('inHub').value.trim() || 'CCJ/KOT';
      const order = document.getElementById('inOrder').value.trim() || 'S99090861540';
      const name = document.getElementById('inName').value;
      const addr1 = document.getElementById('inAddr1').value;
      const landmark = document.getElementById('inLandmark').value;
      const locality = document.getElementById('inLocality').value;
      const pin = document.getElementById('inPin').value;
      const state = document.getElementById('inState').value;

      return `CT~~CD,~CC^~CT~
^XA
~TA000
~JSN
^LT0
^MNW
^MTD
^PON
^PMN
^LH0,0
^JMA
^PR5,5
~SD30
^JUS
^LRN
^CI27
^PA0,1,1,0
^XZ
^XA
^MMT
^PW669
^LL467
^LS0

; --- TOP LINE ---
^FO25,20^A0N,22,22^FDNDD E-Kart Logistics^FS
^FO430,20^A0N,22,22^FDPREPAID^FS
^FO535,14^GB110,32,32^FS
^FO545,20^A0N,20,20^FR^FDPRIORITY^FS
^FO20,52^GB629,2,2^FS

; --- LEFT COLUMN: VERTICAL BARCODE & LABELS ---
^FO25,65^BY2,2.5,58^BCR,58,N,N,N^FD${tid}^FS
^FO95,70^A0R,20,20^FD${hub}^FS
^FO95,190^A0R,20,20^FD${tid}^FS

; --- LOWER LEFT: BATCH & MINI BARCODE ---
^FO25,355^A0N,22,22^FD13-09^FS
^FO25,380^A0N,15,15^FDLIAADSJ270015039^FS
^FO25,402^BY1.2,2,30^BCN,30,N,N,N^FD1309^FS

; --- RIGHT: 2D QR CODE (Upper Right) ---
^FO170,65^BQN,2,6^FDMA,${tid};${order};${pin}^FS

; --- RIGHT: RECIPIENT ADDRESS ---
^FO360,65^A0N,22,22^FD${name}^FS
^FO360,95^A0N,17,17^FD${addr1}^FS
^FO360,120^A0N,16,16^FD${landmark}^FS
^FO360,145^A0N,16,16^FD${locality}^FS
^FO360,175^A0N,19,19^FD${pin}^FS
^FO360,200^A0N,17,17^FD${state}^FS

; --- BOTTOM RIGHT: SELLER & FLIPKART ORDER ID ---
^FO200,400^A0N,20,20^FDNPQ^FS
^FO440,390^A0N,16,16^FDOrdered Through Flipkart^FS
^FO495,414^A0N,20,20^FD${order}^FS

^PQ1,0,1,Y
^XZ
`;
    }

    // 1. Download shipments_[TID].zip containing shipmentId_[TID].prn
    async function downloadZip() {
      const tid = document.getElementById('inTid').value.trim();
      if (!tid) {
        alert("Enter Tracking ID");
        return;
      }

      try {
        const zip = new JSZip();
        const prnData = buildZpl();
        zip.file(`shipmentId_${tid}.prn`, prnData);

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `shipments_${tid}.zip`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("ZIP generation failed: " + e.message);
      }
    }

    // 2. Download standalone shipmentId_[TID].prn
    function downloadPrn() {
      const tid = document.getElementById('inTid').value.trim();
      if (!tid) {
        alert("Enter Tracking ID");
        return;
      }

      const prnData = buildZpl();
      const blob = new Blob([prnData], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `shipmentId_${tid}.prn`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    render();
  </script>
</body>
</html>
