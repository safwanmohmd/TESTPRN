<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ekart NDD Priority ZIP & PRN Generator</title>
  <!-- Barcode & ZIP libraries -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 16px;
    }

    .app-container {
      display: grid;
      grid-template-columns: 330px auto;
      gap: 30px;
      align-items: start;
      max-width: 860px;
      width: 100%;
    }

    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Left Settings Panel */
    .panel {
      background: #151d2f;
      border: 1px solid #28354e;
      border-radius: 8px;
      padding: 16px;
    }

    .panel h2 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    .field {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    input {
      width: 100%;
      background: #0b0f19;
      border: 1px solid #28354e;
      color: #ffffff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-zip {
      background-color: #f59e0b;
      color: #ffffff;
    }

    .btn-prn {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-print {
      background-color: #334155;
      color: #ffffff;
    }

    /* Preview Canvas Area */
    .preview-stage {
      background: #1e293b;
      padding: 24px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
    }

    /* EXACT PHYSICAL RATIO: 320px width × 460px height */
    .label-canvas {
      width: 320px;
      height: 460px;
      background: #ffffff;
      color: #000000;
      border-radius: 4px;
      padding: 12px 14px 10px 14px;
      position: relative;
      font-family: Arial, Helvetica, sans-serif;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      user-select: none;
    }

    /* Top Line */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 16px;
      margin-bottom: 8px;
    }

    .brand-text {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: -0.1px;
    }

    .status-tags {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .status-prepaid {
      font-size: 8.5px;
      font-weight: 700;
    }

    .status-priority {
      background: #000000;
      color: #ffffff;
      padding: 1.5px 3px;
      font-weight: 900;
      font-size: 8px;
    }

    /* Left Column Barcode + Rotated Texts */
    .left-barcode-container {
      position: absolute;
      top: 36px;
      left: 10px;
      width: 50px;
      height: 270px;
    }

    .rotator {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg) translate(-270px, 0);
      transform-origin: top left;
      display: flex;
      align-items: center;
      height: 50px;
      width: 270px;
    }

    .rot-labels-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 270px;
      padding-left: 4px;
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: 8px;
      line-height: 1;
      white-space: nowrap;
    }

    /* Lower Left Batch & Mini Barcode */
    .lower-left-section {
      position: absolute;
      top: 320px;
      left: 14px;
      width: 70px;
    }

    .batch-1 {
      font-size: 9.5px;
      font-weight: 800;
      font-family: Arial, sans-serif;
      line-height: 1.1;
    }

    .batch-2 {
      font-size: 6.5px;
      font-weight: 700;
      font-family: Arial, sans-serif;
      line-height: 1.1;
      margin-top: 1px;
      margin-bottom: 2px;
    }

    /* Right Section: Large QR Code + Address */
    .right-section {
      position: absolute;
      top: 34px;
      left: 78px;
      width: 228px;
    }

    .qr-holder {
      width: 172px;
      height: 172px;
    }

    .qr-holder img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .address-holder {
      margin-top: 6px;
      font-size: 8px;
      line-height: 1.25;
      color: #000000;
    }

    .addr-name {
      font-size: 8.5px;
      font-weight: 800;
      margin-bottom: 1px;
    }

    /* Bottom Row: NPQ & Ordered Through Flipkart */
    .bottom-row {
      position: absolute;
      top: 360px;
      left: 78px;
      width: 228px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .vendor-npq {
      font-size: 8.5px;
      font-weight: 800;
      margin-left: 24px;
    }

    .flipkart-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }

    .fk-text {
      font-size: 7.5px;
      font-weight: 600;
    }

    .fk-order {
      font-size: 8.5px;
      font-weight: 800;
      font-family: Arial, sans-serif;
    }

    @media print {
      body {
        background: transparent;
        padding: 0;
      }
      .panel {
        display: none;
      }
      .preview-stage {
        background: transparent;
        padding: 0;
      }
      .label-canvas {
        box-shadow: none;
        border-radius: 0;
        position: absolute;
        top: 0;
        left: 0;
      }
      @page {
        size: 55mm 80mm portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Config Panel -->
    <div class="panel">
      <h2>Ekart Priority PRN Generator</h2>

      <div class="field">
        <label>Tracking ID (TID) *</label>
        <input type="text" id="inTid" value="FMPP4251661422" oninput="render()" />
      </div>

      <div class="field">
        <label>Hub Code</label>
        <input type="text" id="inHub" value="CCJ/KOT" oninput="render()" />
      </div>

      <div class="field">
        <label>Order Reference ID</label>
        <input type="text" id="inOrder" value="S99090861540" oninput="render()" />
      </div>

      <div class="field">
        <label>Customer Name</label>
        <input type="text" id="inName" value="Nasrin K" oninput="render()" />
      </div>

      <div class="field">
        <label>Address Line 1</label>
        <input type="text" id="inAddr1" value="Kuruniyan saw mill Othukkungal" oninput="render()" />
      </div>

      <div class="field">
        <label>Landmark</label>
        <input type="text" id="inLandmark" value="after the transformer" oninput="render()" />
      </div>

      <div class="field">
        <label>Locality</label>
        <input type="text" id="inLocality" value="Nottanalakkal, Othukkungal, Near Jamia Ihyaussun" oninput="render()" />
      </div>

      <div class="field">
        <label>District & PIN</label>
        <input type="text" id="inPin" value="Malappuram - 676528" oninput="render()" />
      </div>

      <div class="field">
        <label>State</label>
        <input type="text" id="inState" value="Kerala" oninput="render()" />
      </div>

      <div class="btn-row">
        <!-- ZIP Download Button matching your exact repo naming -->
        <button class="btn-zip" onclick="downloadZipArchive()">
          📦 Download shipments_[TID].zip
        </button>
        <button class="btn-prn" onclick="downloadSinglePrn()">
          📄 Download shipmentId_[TID].prn
        </button>
        <button class="btn-print" onclick="window.print()">
          🖨️ Print Label
        </button>
      </div>
    </div>

    <!-- Live Preview Stage -->
    <div class="preview-stage">
      <div class="label-canvas">
        <!-- Top Header -->
        <div class="top-header">
          <span class="brand-text">NDD E-Kart Logistics</span>
          <div class="status-tags">
            <span class="status-prepaid">PREPAID</span>
            <span class="status-priority">PRIORITY</span>
          </div>
        </div>

        <!-- Left Vertical Code 128 Barcode -->
        <div class="left-barcode-container">
          <div class="rotator">
            <svg id="svgMainBarcode"></svg>
            <div class="rot-labels-col">
              <span id="dispHub">CCJ/KOT</span>
              <span id="dispTid">FMPP4251661422</span>
            </div>
          </div>
        </div>

        <!-- Lower Left Batch & Mini Barcode -->
        <div class="lower-left-section">
          <div class="batch-1">13-09</div>
          <div class="batch-2">LIAADSJ270015039</div>
          <svg id="svgMiniBarcode"></svg>
        </div>

        <!-- Right: Square QR + Customer Address -->
        <div class="right-section">
          <div class="qr-holder">
            <img id="qrImg" src="" alt="QR" />
          </div>

          <div class="address-holder">
            <div class="addr-name" id="dispName">Nasrin K</div>
            <div id="dispAddr1">Kuruniyan saw mill Othukkungal</div>
            <div id="dispLandmark">after the transformer</div>
            <div id="dispLocality">Nottanalakkal, Othukkungal, Near Jamia Ihyaussun</div>
            <div id="dispPin">Malappuram - 676528</div>
            <div id="dispState">Kerala</div>
          </div>
        </div>

        <!-- Bottom Row: NPQ & Flipkart Order ID -->
        <div class="bottom-row">
          <span class="vendor-npq">NPQ</span>
          <div class="flipkart-col">
            <span class="fk-text">Ordered Through Flipkart</span>
            <span class="fk-order" id="dispOrder">S99090861540</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function render() {
      const tid = document.getElementById('inTid').value.trim() || 'FMPP4251661422';
      const hub = document.getElementById('inHub').value.trim() || 'CCJ/KOT';
      const order = document.getElementById('inOrder').value.trim() || 'S99090861540';
      const name = document.getElementById('inName').value;
      const addr1 = document.getElementById('inAddr1').value;
      const landmark = document.getElementById('inLandmark').value;
      const locality = document.getElementById('inLocality').value;
      const pin = document.getElementById('inPin').value;
      const state = document.getElementById('inState').value;

      document.getElementById('dispHub').textContent = hub;
      document.getElementById('dispTid').textContent = tid;
      document.getElementById('dispName').textContent = name;
      document.getElementById('dispAddr1').textContent = addr1;
      document.getElementById('dispLandmark').textContent = landmark;
      document.getElementById('dispLocality').textContent = locality;
      document.getElementById('dispPin').textContent = pin;
      document.getElementById('dispState').textContent = state;
      document.getElementById('dispOrder').textContent = order;

      // Tall Left Barcode: 270px long in rotation
      try {
        JsBarcode("#svgMainBarcode", tid, {
          format: "CODE128",
          width: 1.45,
          height: 38,
          displayValue: false,
          margin: 0,
          background: "transparent",
          lineColor: "#000000"
        });
      } catch (e) {}

      // Mini Route Barcode (Bottom-Left)
      try {
        JsBarcode("#svgMiniBarcode", "1309", {
          format: "CODE128",
          width: 0.95,
          height: 22,
          displayValue: false,
          margin: 0,
          background: "transparent",
          lineColor: "#000000"
        });
      } catch (e) {}

      // Square 2D QR Code
      const qrData = `${tid};${order};${pin}`;
      document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;
    }

    // Build ZPL PRN string matching the image layout
    function buildZplContent() {
      const tid = document.getElementById('inTid').value.trim();
      const hub = document.getElementById('inHub').value.trim() || 'CCJ/KOT';
      const order = document.getElementById('inOrder').value.trim() || 'S99090861540';
      const name = document.getElementById('inName').value;
      const addr1 = document.getElementById('inAddr1').value;
      const landmark = document.getElementById('inLandmark').value;
      const locality = document.getElementById('inLocality').value;
      const pin = document.getElementById('inPin').value;
      const state = document.getElementById('inState').value;

      return `CT~~CD,~CC^~CT~
^XA
~TA000~JSN^LT0^MNW^MTD^PON^PMN^LH0,0^JMA^PR5,5~SD30^JUS^LRN^CI27^PA0,1,1,0
^XZ
^XA
^PW440
^LL640
^PON

; --- TOP LINE ---
^FO20,18^A0N,18,18^FDNDD E-Kart Logistics^FS
^FO260,18^A0N,18,18^FDPREPAID^FS
^FO340,14^GB75,22,22^FS
^FO346,18^A0N,16,16^FR^FDPRIORITY^FS

; --- LEFT COLUMN: VERTICAL BARCODE & LABELS ---
^FO20,48^BY2,2.5,42^BCR,42,N,N,N^FD${tid}^FS
^FO70,52^A0R,16,16^FD${hub}^FS
^FO70,225^A0R,16,16^FD${tid}^FS

; --- LOWER LEFT: BATCH & MINI BARCODE ---
^FO20,430^A0N,18,18^FD13-09^FS
^FO20,452^A0N,12,12^FDLIAADSJ270015039^FS
^FO20,470^BY1,2,26^BCN,26,N,N,N^FD1309^FS

; --- RIGHT: SQUARE 2D QR CODE ---
^FO115,48^BQN,2,5^FDMA,${tid};${order};${pin}^FS

; --- RIGHT: RECIPIENT ADDRESS ---
^FO115,268^A0N,18,18^FD${name}^FS
^FO115,292^A0N,14,14^FD${addr1}^FS
^FO115,312^A0N,13,13^FD${landmark}^FS
^FO115,332^A0N,13,13^FD${locality}^FS
^FO115,352^A0N,15,15^FD${pin}^FS
^FO115,372^A0N,14,14^FD${state}^FS

; --- BOTTOM ROW: NPQ & FLIPKART ORDER ID ---
^FO155,420^A0N,16,16^FDNPQ^FS
^FO240,412^A0N,13,13^FDOrdered Through Flipkart^FS
^FO295,430^A0N,16,16^FD${order}^FS

^PQ1,0,1,Y
^XZ
`;
    }

    // 1. Download shipments_[TID].zip containing shipmentId_[TID].prn
    async function downloadZipArchive() {
      const tid = document.getElementById('inTid').value.trim();
      if (!tid) {
        alert("Please enter a Tracking ID.");
        return;
      }

      try {
        const zip = new JSZip();
        const prnData = buildZplContent();

        // Exact internal file name format from your repo: shipmentId_[TID].prn
        const fileName = `shipmentId_${tid}.prn`;
        zip.file(fileName, prnData);

        // Generate zip file
        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        // Exact outer archive name format from your repo: shipments_[TID].zip
        link.download = `shipments_${tid}.zip`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("Failed to generate ZIP archive: " + err.message);
      }
    }

    // 2. Download standalone shipmentId_[TID].prn file
    function downloadSinglePrn() {
      const tid = document.getElementById('inTid').value.trim();
      if (!tid) {
        alert("Please enter a Tracking ID.");
        return;
      }

      const prnData = buildZplContent();
      const blob = new Blob([prnData], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `shipmentId_${tid}.prn`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // Initialize on load
    render();
  </script>
</body>
</html>
