<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ekart NDD Priority (Exact Thermal Alignment)</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    .wrapper {
      display: grid;
      grid-template-columns: 320px auto;
      gap: 28px;
      align-items: start;
      max-width: 1050px;
      width: 100%;
    }

    @media (max-width: 800px) {
      .wrapper {
        grid-template-columns: 1fr;
      }
    }

    .form-panel {
      background: #151d2f;
      border: 1px solid #28354e;
      border-radius: 8px;
      padding: 16px;
    }

    .form-panel h2 {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .input-field {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    input {
      width: 100%;
      background: #0b0f19;
      border: 1px solid #28354e;
      color: #ffffff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-zip {
      background-color: #f59e0b;
      color: #ffffff;
    }

    .btn-prn {
      background-color: #0284c7;
      color: #ffffff;
    }

    .preview-box {
      background: #1e293b;
      padding: 24px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    /* MATCHES EXACT STICKER ASPECT RATIO IN YOUR PHOTO */
    .sticker {
      width: 600px;
      height: 380px;
      min-width: 600px;
      min-height: 380px;
      background: #ffffff;
      color: #000000;
      border-radius: 8px;
      padding: 16px 20px 14px 20px;
      position: relative;
      font-family: Arial, Helvetica, sans-serif;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      user-select: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Line Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.2px;
      border-bottom: 2px solid #000;
      padding-bottom: 4px;
    }

    .status-area {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .priority-badge {
      background: #000000;
      color: #ffffff;
      padding: 2px 5px;
      font-weight: 900;
      font-size: 11px;
    }

    /* Main Grid: Left Column Barcode | Right Side QR & Details */
    .body-grid {
      display: grid;
      grid-template-columns: 80px 180px 1fr;
      gap: 16px;
      align-items: start;
      margin-top: 8px;
      flex: 1;
    }

    /* Vertical Barcode Column */
    .barcode-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 280px;
      position: relative;
    }

    .rotated-barcode {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg) translate(-210px, 0);
      transform-origin: top left;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      width: 210px;
    }

    .rotated-text {
      display: flex;
      flex-direction: column;
      font-size: 9px;
      font-weight: 800;
      line-height: 1.1;
      font-family: Arial, sans-serif;
    }

    .bottom-batch-box {
      position: absolute;
      bottom: 0;
      left: 2px;
    }

    .batch-t1 {
      font-size: 11px;
      font-weight: 900;
    }

    .batch-t2 {
      font-size: 8px;
      font-weight: 700;
      color: #334155;
      margin: 1px 0 2px 0;
    }

    /* Center QR Column */
    .qr-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .qr-col img {
      width: 170px;
      height: 170px;
      display: block;
    }

    .vendor-tag {
      font-size: 13px;
      font-weight: 900;
      margin-left: 20px;
    }

    /* Right Address & Flipkart Column */
    .address-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 280px;
      padding-left: 10px;
    }

    .address-box {
      font-size: 12px;
      line-height: 1.35;
      color: #000;
    }

    .customer-title {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 2px;
    }

    .pin-title {
      font-weight: 800;
      margin-top: 2px;
    }

    .fk-footer {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }

    .fk-text {
      font-size: 11px;
      font-weight: 600;
      color: #334155;
    }

    .fk-order {
      font-size: 13px;
      font-weight: 900;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Form Inputs -->
    <div class="form-panel">
      <h2>Ekart Label Configuration</h2>

      <div class="input-field">
        <label>Tracking ID (TID) *</label>
        <input type="text" id="inTid" value="FMPP4251661422" oninput="render()" />
      </div>

      <div class="input-field">
        <label>Hub Code</label>
        <input type="text" id="inHub" value="CCJ/KOT" oninput="render()" />
      </div>

      <div class="input-field">
        <label>Flipkart Order ID</label>
        <input type="text" id="inOrder" value="S99090861540" oninput="render()" />
      </div>

      <div class="input-field">
        <label>Customer Name</label>
        <input type="text" id="inName" value="Nasrin K" oninput="render()" />
      </div>

      <div class="input-field">
        <label>Address Line 1</label>
        <input type="text" id="inAddr1" value="Kuruniyan saw mill Othukkungal" oninput="render()" />
      </div>

      <div class="input-field">
        <label>Landmark</label>
        <input type="text" id="inLandmark" value="after the transformer" oninput="render()" />
      </div>

      <div class="input-field">
        <label>Area / Locality</label>
        <input type="text" id="inLocality" value="Nottanalakkal, Othukkungal, Near Jamia Ihyaussun" oninput="render()" />
      </div>

      <div class="input-field">
        <label>District & PIN</label>
        <input type="text" id="inPin" value="Malappuram - 676528" oninput="render()" />
      </div>

      <div class="input-field">
        <label>State</label>
        <input type="text" id="inState" value="Kerala" oninput="render()" />
      </div>

      <div class="btn-group">
        <button class="btn-zip" onclick="downloadZip()">
          📦 Download shipments_[TID].zip
        </button>
        <button class="btn-prn" onclick="downloadPrn()">
          📄 Download shipmentId_[TID].prn
        </button>
      </div>
    </div>

    <!-- Live Preview Canvas -->
    <div class="preview-box">
      <div class="sticker">
        <!-- Top Header -->
        <div class="header-bar">
          <span>NDD E-Kart Logistics</span>
          <div class="status-area">
            <span>PREPAID</span>
            <span class="priority-badge">PRIORITY</span>
          </div>
        </div>

        <!-- Body Grid -->
        <div class="body-grid">
          <!-- Left: Rotated Barcode & Mini Barcode -->
          <div class="barcode-col">
            <div class="rotated-barcode">
              <svg id="svgMainBarcode"></svg>
              <div class="rotated-text">
                <span id="dispHub">CCJ/KOT</span>
                <span id="dispTid">FMPP4251661422</span>
              </div>
            </div>

            <div class="bottom-batch-box">
              <div class="batch-t1">13-09</div>
              <div class="batch-t2">LIAADSJ270015039</div>
              <svg id="svgMiniBarcode"></svg>
            </div>
          </div>

          <!-- Middle: QR Code + NPQ -->
          <div class="qr-col">
            <img id="qrImg" src="" alt="QR" />
            <span class="vendor-tag">NPQ</span>
          </div>

          <!-- Right: Customer Address + Order ID -->
          <div class="address-col">
            <div class="address-box">
              <div class="customer-title" id="dispName">Nasrin K</div>
              <div id="dispAddr1">Kuruniyan saw mill Othukkungal</div>
              <div id="dispLandmark" style="font-style: italic; color: #475569;">after the transformer</div>
              <div id="dispLocality">Nottanalakkal, Othukkungal, Near Jamia Ihyaussun</div>
              <div class="pin-title" id="dispPin">Malappuram - 676528</div>
              <div id="dispState">Kerala</div>
            </div>

            <div class="fk-footer">
              <span class="fk-text">Ordered Through Flipkart</span>
              <span class="fk-order" id="dispOrder">S99090861540</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function render() {
      const tid = document.getElementById('inTid').value.trim() || 'FMPP4251661422';
      const hub = document.getElementById('inHub').value.trim() || 'CCJ/KOT';
      const order = document.getElementById('inOrder').value.trim() || 'S99090861540';
      const name = document.getElementById('inName').value;
      const addr1 = document.getElementById('inAddr1').value;
      const landmark = document.getElementById('inLandmark').value;
      const locality = document.getElementById('inLocality').value;
      const pin = document.getElementById('inPin').value;
      const state = document.getElementById('inState').value;

      document.getElementById('dispHub').textContent = hub;
      document.getElementById('dispTid').textContent = tid;
      document.getElementById('dispName').textContent = name;
      document.getElementById('dispAddr1').textContent = addr1;
      document.getElementById('dispLandmark').textContent = landmark;
      document.getElementById('dispLocality').textContent = locality;
      document.getElementById('dispPin').textContent = pin;
      document.getElementById('dispState').textContent = state;
      document.getElementById('dispOrder').textContent = order;

      // Barcodes
      try {
        JsBarcode("#svgMainBarcode", tid, {
          format: "CODE128",
          width: 1.3,
          height: 38,
          displayValue: false,
          margin: 0,
          background: "transparent",
          lineColor: "#000000"
        });
      } catch (e) {}

      try {
        JsBarcode("#svgMiniBarcode", "1309", {
          format: "CODE128",
          width: 0.9,
          height: 20,
          displayValue: false,
          margin: 0,
          background: "transparent",
          lineColor: "#000000"
        });
      } catch (e) {}

      // QR
      const qrData = `${tid};${order};${pin}`;
      document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(qrData)}`;
    }

    // Exact ZPL generator matching the printer feed direction
    function buildZpl() {
      const tid = document.getElementById('inTid').value.trim();
      const hub = document.getElementById('inHub').value.trim() || 'CCJ/KOT';
      const order = document.getElementById('inOrder').value.trim() || 'S99090861540';
      const name = document.getElementById('inName').value;
      const addr1 = document.getElementById('inAddr1').value;
      const landmark = document.getElementById('inLandmark').value;
      const locality = document.getElementById('inLocality').value;
      const pin = document.getElementById('inPin').value;
      const state = document.getElementById('inState').value;

      return `CT~~CD,~CC^~CT~
^XA
~TA000~JSN^LT0^MNW^MTD^PON^PMN^LH0,0^JMA^PR5,5~SD30^JUS^LRN^CI27^PA0,1,1,0
^XZ
^XA
^MMT
^PW669
^LL467
^LS0

; --- TOP LINE ACROSS HEADER ---
^FO25,18^A0N,20,20^FDNDD E-Kart Logistics^FS
^FO430,18^A0N,20,20^FDPREPAID^FS
^FO530,12^GB100,28,28^FS
^FO538,18^A0N,18,18^FR^FDPRIORITY^FS
^FO20,44^GB625,2,2^FS

; --- LEFT COLUMN: VERTICAL BARCODE & ROTATED STRIP ---
^FO25,58^BY2,2.5,42^BCR,42,N,N,N^FD${tid}^FS
^FO75,62^A0R,16,16^FD${hub}^FS
^FO75,200^A0R,16,16^FD${tid}^FS

; --- LOWER LEFT: BATCH NUMBERS & MINI BARCODE ---
^FO25,325^A0N,18,18^FD13-09^FS
^FO25,348^A0N,13,13^FDLIAADSJ270015039^FS
^FO25,368^BY1.2,2,24^BCN,24,N,N,N^FD1309^FS

; --- CENTER: 2D QR CODE MATRIX ---
^FO130,58^BQN,2,6^FDMA,${tid};${order};${pin}^FS
^FO170,325^A0N,20,20^FDNPQ^FS

; --- RIGHT: RECIPIENT ADDRESS & FLIPKART DETAILS ---
^FO320,58^A0N,20,20^FD${name}^FS
^FO320,86^A0N,16,16^FD${addr1}^FS
^FO320,110^A0N,15,15^FD${landmark}^FS
^FO320,134^A0N,15,15^FD${locality}^FS
^FO320,162^A0N,18,18^FD${pin}^FS
^FO320,188^A0N,16,16^FD${state}^FS

; --- BOTTOM RIGHT FOOTER ---
^FO420,340^A0N,15,15^FDOrdered Through Flipkart^FS
^FO480,365^A0N,18,18^FD${order}^FS

^PQ1,0,1,Y
^XZ
`;
    }

    async function downloadZip() {
      const tid = document.getElementById('inTid').value.trim();
      if (!tid) {
        alert("Enter Tracking ID");
        return;
      }

      try {
        const zip = new JSZip();
        zip.file(`shipmentId_${tid}.prn`, buildZpl());

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `shipments_${tid}.zip`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      } catch (e) {
        alert("Error generating ZIP: " + e.message);
      }
    }

    function downloadPrn() {
      const tid = document.getElementById('inTid').value.trim();
      if (!tid) {
        alert("Enter Tracking ID");
        return;
      }

      const blob = new Blob([buildZpl()], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `shipmentId_${tid}.prn`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    render();
  </script>
</body>
</html>
